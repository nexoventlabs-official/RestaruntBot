# Pod Disruption Budget for Backend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: restaurant-bot
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend
---
# Pod Disruption Budget for Frontend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: restaurant-bot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
