apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: restaurant-bot
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual base64 encoded values in production
  # Use: echo -n 'your-value' | base64
  MONGODB_URI: "mongodb://mongodb-service:27017/restaurant"
  JWT_SECRET: "your-jwt-secret-here"
  JWT_REFRESH_SECRET: "your-jwt-refresh-secret-here"
  RAZORPAY_KEY_ID: "your-razorpay-key-id"
  RAZORPAY_KEY_SECRET: "your-razorpay-key-secret"
  WHATSAPP_PHONE_NUMBER_ID: "your-whatsapp-phone-number-id"
  WHATSAPP_ACCESS_TOKEN: "your-whatsapp-access-token"
  WHATSAPP_VERIFY_TOKEN: "your-whatsapp-verify-token"
  WHATSAPP_WEBHOOK_SECRET: "your-whatsapp-webhook-secret"
  CLOUDINARY_CLOUD_NAME: "your-cloudinary-cloud-name"
  CLOUDINARY_API_KEY: "your-cloudinary-api-key"
  CLOUDINARY_API_SECRET: "your-cloudinary-api-secret"
  GROQ_API_KEY: "your-groq-api-key"
  GOOGLE_SHEETS_CREDENTIALS: "your-google-sheets-credentials-json"
  BREVO_API_KEY: "your-brevo-api-key"
  SLACK_WEBHOOK_URL: "your-slack-webhook-url"
  ALERT_EMAIL: "your-alert-email"
---
# Note: In production, use external secret management like:
# - AWS Secrets Manager
# - Azure Key Vault
# - Google Secret Manager
# - HashiCorp Vault
# - Sealed Secrets
